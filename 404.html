<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Milad Nasrollahi</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="4; url=./">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111310;
      color: #e4e6dc;
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    p { margin: 0 0 14px; font-size: 15px; line-height: 1.6; color: #b3b8ab; }
    a {
      color: #d2f89b;
      font-family: "SFMono-Regular", ui-monospace, Menlo, monospace;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 3px;
    }
    a:focus-visible { outline: 2px solid #d2f89b; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p>That page does not exist. Taking you back to the CV.</p>
    <a id="back" href="./">Back to the CV</a>
  </main>
  <script>
    (function () {
      var path = window.location.pathname;
      var root = path.indexOf('/resume/') === 0 ? '/resume/' : '/';
      var back = document.getElementById('back');
      if (back) back.href = root;
      setTimeout(function () { window.location.replace(root); }, 2500);
    })();
  </script>
</body>
</html>
